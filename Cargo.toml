[package]
name = "map_savvy"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# cached="0"
eframe="0.31"
egui = "0.31"
egui_extras = {version = "0.31", features = ["image"]}
image = {version = "0.25", features=["jpeg","png"]}
itertools = "0.14"
poll-promise = "0.3"
# ndarray = "0"
# num-complex = "0.4.3"
rand = "0"
rayon = "1.8"
serde = "1.0"

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy)
[profile.dev.package."*"]
opt-level = 3
